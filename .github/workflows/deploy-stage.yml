name: Deploy stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w web

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/leettracker-deploy-${{ inputs.stage }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy
        working-directory: infra
        run: npx cdk deploy LeetTracker-${{ inputs.stage }} --require-approval never --outputs-file outputs.json

      - name: Smoke test
        working-directory: infra
        run: |
          url=$(node -p "require('./outputs.json')['LeetTracker-${{ inputs.stage }}'].SiteUrl")
          echo "Checking $url/api/health"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$url/api/health" | tee health.json
          grep -q '"ok":true' health.json
