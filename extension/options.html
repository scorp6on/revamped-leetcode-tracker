<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lc/tracker sync</title>
<style>
  :root { --bg: #fff; --fg: #0a0a0a; --muted: #737373; --border: #e5e5e5; --subtle: #f5f5f5; --primary: #171717; --primary-fg: #fafafa; --error: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a1a1a1; --border: #262626; --subtle: #171717; --primary: #fafafa; --primary-fg: #171717; --error: #f87171; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font: 500 16px ui-monospace, monospace; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; }
  select, input { height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--fg); font: inherit; font-weight: 500; cursor: pointer; }
  button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  .muted { color: var(--muted); }
  .status { padding: 12px; border-radius: 8px; background: var(--subtle); display: flex; flex-direction: column; gap: 4px; }
  .error { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>lc/tracker sync</h1>
  <p class="muted">Reads your LeetCode submissions in this browser and sends them to your tracker. Get a token from <b>Connect extension</b> on the tracker's Home page.</p>

  <label>Tracker
    <select id="server">
      <option value="https://dcl5cus2cnbj3.cloudfront.net">Prod</option>
      <option value="https://d22dgdygw10q10.cloudfront.net">Dev</option>
    </select>
  </label>
  <label>Token
    <input id="token" type="password" autocomplete="off" placeholder="Paste the token from the tracker">
  </label>
  <div class="row">
    <button id="save" class="primary">Save</button>
    <button id="sync">Sync now</button>
  </div>

  <div class="status" role="status" aria-live="polite">
    <span id="last" class="muted">Not synced yet.</span>
    <span id="error" class="error"></span>
  </div>
</main>
<script src="options.js" type="module"></script>
</body>
</html>
